# Render Blueprint: the public recruiter demo backend ONLY (SPRING_PROFILES_ACTIVE=demo, in-memory H2,
# no provider keys). The business deployment (prod profile, Neon Postgres) is configured separately.
services:
  - type: web
    name: freelance-agency-demo-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: CORS_ALLOWED_ORIGINS
        value: https://freelance-agency-demo.vercel.app
      - key: JWT_SECRET
        generateValue: true
      # Fits the 512 MB free instance: about 300 MiB in use measured locally under `docker run -m 512m`.
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx256m -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -Xss512k -XX:ReservedCodeCacheSize=64m
