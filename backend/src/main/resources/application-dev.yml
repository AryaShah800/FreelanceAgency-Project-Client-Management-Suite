spring:
  datasource:
    # Development always uses disposable H2; never inherit a Neon URL in this profile.
    url: jdbc:h2:mem:freelancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
    show-sql: false

app:
  email:
    delivery-mode: console
    frontend-base-url: http://localhost:5173
  bootstrap:
    secret: ${OWNER_BOOTSTRAP_SECRET:}
  jwt:
    # Set a private secret in backend/.env, even for local development.
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  gemini:
    # Optional. Without a provider key, AIService returns its local proposal template.
    api-key: ${GEMINI_API_KEY:}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
