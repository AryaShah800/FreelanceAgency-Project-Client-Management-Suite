spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:freelancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

app:
  jwt:
    # No fallback default on purpose: a checked-in secret is a forgeable-token
    # risk the moment this repo is public. Copy backend/.env.example to
    # backend/.env and set your own value (e.g. `openssl rand -hex 32`).
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  gemini:
    # No fallback default on purpose: a checked-in API key is billable-abuse
    # risk the moment this repo is public. Set GEMINI_API_KEY in backend/.env.
    api-key: ${GEMINI_API_KEY:}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
