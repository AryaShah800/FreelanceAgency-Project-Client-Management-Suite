server:
  tomcat:
    remoteip:
      # Render's load balancer reaches the app from private addresses. Trust those (Spring
      # Boot's default list) so getRemoteAddr() is the visitor from X-Forwarded-For; with
      # loopback only, every visitor shared one rate-limit bucket.
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|100\.6[4-9]{1}\.\d{1,3}\.\d{1,3}|100\.[7-9]{1}\d{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1]{1}\d{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]{1}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true

app:
  ai:
    daily-generation-limit: ${AI_DAILY_GENERATION_LIMIT:50}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  gemini:
    # AI drafting falls back to the built-in template when this is blank.
    api-key: ${GEMINI_API_KEY:}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
  razorpay:
    # Checkout is disabled unless both values are configured.
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
    # Separate secret Razorpay signs webhook payloads with (Dashboard > Webhooks).
    # Deliberately not defaulted to app.razorpay.key-secret: keep it a distinct value.
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  email:
    delivery-mode: resend
    resend-api-key: ${RESEND_API_KEY}
    resend-from: ${RESEND_FROM}
    frontend-base-url: ${APP_FRONTEND_BASE_URL}
  bootstrap:
    secret: ${OWNER_BOOTSTRAP_SECRET:}
