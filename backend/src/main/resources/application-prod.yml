spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  gemini:
    api-key: ${GEMINI_API_KEY}
    api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    # Separate secret Razorpay signs webhook payloads with (Dashboard > Webhooks).
    # Deliberately not defaulted to app.razorpay.key-secret: keep it a distinct value.
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
